<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKALUs Global | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background-color: var(--bg-primary, #050505); color: var(--text-primary, #ffffff); }
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 250px; background: rgba(255, 255, 255, 0.03); border-right: 1px solid rgba(255, 255, 255, 0.05); padding: 2rem; }
        .admin-logo { font-size: 1.5rem; font-weight: 700; margin-bottom: 3rem; display: block; color: #fff; text-decoration: none; }
        .admin-nav a { display: block; padding: 1rem; color: rgba(255, 255, 255, 0.7); text-decoration: none; margin-bottom: 0.5rem; border-radius: 8px; transition: all 0.3s; }
        .admin-nav a:hover, .admin-nav a.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .admin-main { flex: 1; padding: 3rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: rgba(255, 255, 255, 0.03); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-value { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .stat-label { font-size: 0.875rem; color: rgba(255, 255, 255, 0.5); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .data-table th { color: rgba(255, 255, 255, 0.5); font-weight: 500; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="index.html" class="admin-logo">AKAL<span style="color: #6366f1;">Us</span></a>
            <nav class="admin-nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Users</a>
                <a href="#">Inquiries</a>
                <a href="#">Settings</a>
                <a href="#" id="adminLogout">Logout</a>
            </nav>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1>Admin Dashboard</h1>
                <div class="admin-profile">Admin User</div>
            </header>
            
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value">124</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">38</div>
                    <div class="stat-label">New Leads</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">12</div>
                    <div class="stat-label">Active Sessions</div>
                </div>
            </div>

            <div class="stat-card" style="margin-bottom: 2rem;">
                <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Recent Registrations (Mock Data)</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td>Jane Doe</td>
                            <td>jane@example.com</td>
                            <td>Today</td>
                            <td><span style="color: #10b981;">Active</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module">
        import { auth, onAuthStateChanged, signOut } from './firebase-config.js';
        
        // Simple mock protection
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // For demonstration, we won't strictly block them, just log
                console.log("No user signed in, but showing mock admin panel anyway.");
                // window.location.href = 'index.html'; // uncomment in prod
            }
        });

        document.getElementById('adminLogout').addEventListener('click', (e) => {
            e.preventDefault();
            signOut(auth).then(() => {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
